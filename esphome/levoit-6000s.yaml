esphome:
  name: levoit-6000s
  friendly_name: Levoit Superior 6000S
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c3-devkitc-02
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Levoit-6000S-Fallback"
    password: !secret fallback_ap_password

logger:
  level: DEBUG
  baud_rate: 0
  # UART1 belongs to the MCU link (tx=GPIO19 rx=GPIO18). UART0 is the J1
  # console header, so logging must never be pointed at UART1.
  hardware_uart: UART0

api:
  encryption:
    key: !secret levoit-6000s_api_key
  # Entities are non-optimistic, so a fresh client would sit on "unknown" until
  # the MCU's next unsolicited report (up to ~15 s). Poll instead, and force a
  # full publish so every entity lands even if no value changed.
  on_client_connected:
    - lambda: |-
        auto *hub = levoit_6000s::Levoit6000S::instance;
        if (hub) { hub->publish_all = true; hub->request_status(); }

ota:
  - platform: esphome
    password: !secret ota_password

captive_portal:

levoit_6000s:
  id: levoit_hub

interval:
  # Nothing here is optimistic: every entity below shows what the MCU last
  # reported, never what we asked for. Publishes are gated on an actual change
  # so a steady device does not rewrite 18 states every 11 s; publish_all
  # forces one unconditional pass at boot and on each new API client.
  - interval: 200ms
    then:
      - lambda: |-
          using levoit_6000s::Levoit6000S;
          auto *h = Levoit6000S::instance;
          if (!h || !h->state_dirty) return;
          h->state_dirty = false;
          bool full = h->publish_all;
          h->publish_all = false;

          // id() yields a pointer, so these take pointers.
          auto pub_sensor = [&](sensor::Sensor *e, float v) {
            if (!full && ((std::isnan(v) && std::isnan(e->state)) || e->state == v)) return;
            e->publish_state(v);
          };
          auto pub_number = [&](number::Number *e, float v) {
            if (std::isnan(v)) return;
            if (!full && e->has_state() && e->state == v) return;
            e->publish_state(v);
          };
          auto pub_binary = [&](binary_sensor::BinarySensor *e, bool v) {
            if (!full && e->has_state() && e->state == v) return;
            e->publish_state(v);
          };
          auto pub_switch = [&](switch_::Switch *e, bool v) {
            if (!full && e->state == v) return;
            e->publish_state(v);
          };
          // Select exposes its state as an index, not a string. index_of() also
          // guards the publish: publish_state rejects any value that is not an
          // option, so an unmapped mode name is dropped rather than logged as
          // an error every frame.
          auto pub_select = [&](select::Select *e, const std::string &v) {
            if (v.empty()) return;
            auto want = e->index_of(v);
            if (!want.has_value()) return;
            auto cur = e->active_index();
            if (!full && cur.has_value() && *cur == *want) return;
            e->publish_state(v);
          };

          pub_sensor(id(current_humidity), h->humidity);
          pub_sensor(id(current_temp), h->temperature);
          pub_sensor(id(fan_output), h->fan_actual);
          pub_sensor(id(filter_life_pct), h->filter_life_pct);
          pub_sensor(id(filter_life_days), h->filter_life_days);
          // Deliberately publishes NAN when no dry cycle is running, so the
          // entity reads "unknown" instead of a frozen leftover countdown.
          pub_sensor(id(dry_remaining), h->dry_minutes_left);

          pub_binary(id(water_tank_missing), h->water_tank_missing);
          pub_binary(id(low_water), h->low_water);
          pub_binary(id(humidifying), h->output_running);
          pub_binary(id(filter_drying), h->filter_drying);

          pub_switch(id(power), h->power_on);
          pub_switch(id(display_sw), h->display_on);
          pub_switch(id(child_lock), h->child_lock);
          pub_switch(id(dry_water_shortage), h->dry_on_water_shortage);
          pub_switch(id(dry_power_off), h->dry_on_power_off);

          pub_number(id(target_humidity), h->target_humidity);

          pub_select(id(mode_select), h->work_mode);
          pub_select(id(fan_speed_select), h->fan_level_name);

sensor:
  - platform: template
    name: "Humidity"
    id: current_humidity
    device_class: humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "Temperature"
    id: current_temp
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement

  # Key 0x0C: the fan that is actually turning, 0-9, and 0 whenever the unit is
  # idle. The Fan Speed select below is the setpoint (key 0x15) and is the one
  # to control from. These two diverge in Auto and only track in Manual.
  - platform: template
    name: "Fan Output"
    id: fan_output
    icon: "mdi:fan"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic

  # Key 0x17: read 65, and a filter reset put it back to 100.
  - platform: template
    name: "Filter Life"
    id: filter_life_pct
    unit_of_measurement: "%"
    icon: "mdi:air-filter"
    accuracy_decimals: 0
    state_class: measurement

  # Key 0x16: constant 120, the rated filter life rather than a countdown.
  - platform: template
    name: "Filter Rated Life"
    id: filter_life_days
    unit_of_measurement: "days"
    accuracy_decimals: 0
    entity_category: diagnostic

  # Key 0x14 bytes[0:2]: a 2 h countdown that only ticks while a dry cycle runs.
  - platform: template
    name: "Filter Dry Remaining"
    id: dry_remaining
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    accuracy_decimals: 0
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Water Tank Missing"
    id: water_tank_missing
    device_class: problem

  - platform: template
    name: "Low Water"
    id: low_water
    device_class: problem

  - platform: template
    name: "Humidifying"
    id: humidifying
    device_class: running

  # Key 0x14 byte[3]. A dry cycle runs on top of whatever mode is active, so
  # this is a state of its own and not a Mode option. Ends by selecting any mode.
  - platform: template
    name: "Filter Drying"
    id: filter_drying
    icon: "mdi:fan-clock"

switch:
  - platform: template
    name: "Power"
    id: power
    icon: "mdi:power"
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_power(true);
    turn_off_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_power(false);

  - platform: template
    name: "Display"
    id: display_sw
    icon: "mdi:television"
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_display(true);
    turn_off_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_display(false);

  - platform: template
    name: "Child Lock"
    id: child_lock
    icon: "mdi:lock"
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_child_lock(true);
    turn_off_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_child_lock(false);

  - platform: template
    name: "Auto Dry On Power Off"
    id: dry_power_off
    icon: "mdi:fan-clock"
    entity_category: config
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_dry_on_power_off(true);
    turn_off_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_dry_on_power_off(false);

  - platform: template
    name: "Auto Dry On Water Shortage"
    id: dry_water_shortage
    icon: "mdi:water-alert"
    entity_category: config
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_dry_on_water_shortage(true);
    turn_off_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_dry_on_water_shortage(false);

number:
  # Auto and Auto Pro own this value on the device (50 % and 55 %), so writing
  # it from Auto switches to Humidity mode first -- otherwise the MCU stores the
  # number, keeps using its own, and the control visibly snaps back.
  - platform: template
    name: "Target Humidity"
    id: target_humidity
    min_value: 30
    max_value: 80
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_target_humidity((uint8_t) x);

  # Write-only: no status key tracks the user timer, so there is nothing to
  # publish back and no way to confirm the value took. 0x14 is the filter-dry
  # countdown and ignores 0x5019 entirely.
  - platform: template
    name: "Timer"
    id: timer_set
    min_value: 0
    max_value: 12
    step: 1
    unit_of_measurement: "h"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: false
    set_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->set_timer((uint32_t) x * 3600);

select:
  # Modes only. Power is its own switch, and a filter-dry cycle is a state that
  # runs on top of a mode (see the Filter Drying binary sensor), not a mode.
  #
  # "Auto"/"Auto Pro" are one wire mode (0x5532 k01=4) with auto_preference 1/2.
  # Measured: preference 1 -> target 50 % / fan 1, preference 2 -> target 55 % /
  # fan 5. The app sends both frames for one button press and has no "Away" mode.
  - platform: template
    name: "Mode"
    id: mode_select
    icon: "mdi:auto-mode"
    options:
      - "Manual"
      - "Sleep"
      - "Humidity"
      - "Auto"
      - "Auto Pro"
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (!hub) return;
          if (x == "Manual") hub->set_mode(levoit_6000s::MODE_MANUAL);
          else if (x == "Sleep") hub->set_mode(levoit_6000s::MODE_SLEEP);
          else if (x == "Humidity") hub->set_mode(levoit_6000s::MODE_HUMIDITY);
          else if (x == "Auto") hub->set_auto(1);
          else if (x == "Auto Pro") hub->set_auto(2);

  # The app exposes nine speeds; the hardware has three. Metered at every step:
  # 1-3 is low, 4-6 medium, 7-9 high, so this sends 1/5/9 and reports the level
  # that the setpoint (key 0x15) falls into. Setting it outside Manual switches
  # to Manual first, because the MCU otherwise ignores 0x5533.
  - platform: template
    name: "Fan Speed"
    id: fan_speed_select
    icon: "mdi:fan"
    options:
      - "Low"
      - "Medium"
      - "High"
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (!hub) return;
          if (x == "Low") hub->set_fan_level(1);
          else if (x == "Medium") hub->set_fan_level(2);
          else if (x == "High") hub->set_fan_level(3);

button:
  - platform: template
    name: "Reset Filter"
    icon: "mdi:air-filter"
    entity_category: config
    on_press:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->reset_filter();

  # 0x5546 k02: 1 = low, 2 = high. Both run a 2 h cycle; selecting any mode
  # ends it early.
  - platform: template
    name: "Filter Dry (Low)"
    icon: "mdi:fan-speed-1"
    entity_category: config
    on_press:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->run_filter_dry(1);

  - platform: template
    name: "Filter Dry (High)"
    icon: "mdi:fan-speed-3"
    entity_category: config
    on_press:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (hub) hub->run_filter_dry(2);

text:
  # Debug/probe: inject an arbitrary MCU frame at runtime (no recompile).
  # Set value to "<opcode_hex> <klv_hex>", e.g. "5531" or "5000 010101".
  # opcode is parsed as hex (0x prefix optional); klv separators are ignored.
  - platform: template
    name: "Probe Command"
    id: probe_command
    mode: text
    entity_category: diagnostic
    optimistic: true
    min_length: 0
    max_length: 255
    restore_value: false
    set_action:
      - lambda: |-
          auto *hub = levoit_6000s::Levoit6000S::instance;
          if (!hub) return;
          std::string s = x;
          size_t sp = s.find(' ');
          std::string op_s = (sp == std::string::npos) ? s : s.substr(0, sp);
          std::string klv_s = (sp == std::string::npos) ? std::string("") : s.substr(sp + 1);
          uint16_t opcode = (uint16_t) strtol(op_s.c_str(), nullptr, 16);
          auto nib = [](char c) -> int {
            if (c >= '0' && c <= '9') return c - '0';
            if (c >= 'a' && c <= 'f') return c - 'a' + 10;
            if (c >= 'A' && c <= 'F') return c - 'A' + 10;
            return -1;
          };
          std::vector<uint8_t> bytes;
          int hi = -1;
          for (char c : klv_s) {
            int v = nib(c);
            if (v < 0) continue;
            if (hi < 0) { hi = v; }
            else { bytes.push_back((uint8_t)((hi << 4) | v)); hi = -1; }
          }
          hub->send_raw(opcode, bytes.data(), bytes.size());
