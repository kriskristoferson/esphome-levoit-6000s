esphome:
  name: levoit-6000s
  friendly_name: Levoit Superior 6000S
  platformio_options:
    board_build.flash_mode: dio
  includes:
    - usb_disable.h
  on_boot:
    priority: 999
    then:
      - lambda: |-
          #include "soc/usb_serial_jtag_reg.h"
          volatile uint32_t *conf0 = (volatile uint32_t *)USB_SERIAL_JTAG_CONF0_REG;
          *conf0 &= ~USB_SERIAL_JTAG_USB_PAD_ENABLE;

esp32:
  board: esp32-c3-devkitc-02
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: "REDACTED-SSID"
  password: "REDACTED-WIFI-PSK"
  ap:
    ssid: "Levoit-6000S-Fallback"
    password: "REDACTED-AP-PASSWORD"

logger:
  level: DEBUG
  baud_rate: 0
  hardware_uart: UART1

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: "REDACTED-OTA-PASSWORD"

captive_portal:

uart:
  - id: mcu_uart
    tx_pin: GPIO19
    rx_pin: GPIO18
    baud_rate: 115200

levoit_6000s:
  id: humidifier
  uart_id: mcu_uart

sensor:
  - platform: levoit_6000s
    levoit_6000s_id: humidifier
    current_humidity:
      name: "Current Humidity"
    current_temp:
      name: "Current Temperature"
    fan_speed:
      name: "Fan Speed"
    filter_life_pct:
      name: "Filter Life"
    filter_life_days:
      name: "Filter Life Days"
    timer_remaining:
      name: "Timer Remaining"

switch:
  - platform: levoit_6000s
    levoit_6000s_id: humidifier
    power:
      name: "Power"
    display:
      name: "Display"
    child_lock:
      name: "Child Lock"
    auto_dry:
      name: "Auto Dry"

number:
  - platform: levoit_6000s
    levoit_6000s_id: humidifier
    target_humidity:
      name: "Target Humidity"
      unit_of_measurement: "%"
    timer:
      name: "Timer"
      unit_of_measurement: "h"

binary_sensor:
  - platform: levoit_6000s
    levoit_6000s_id: humidifier
    water_tank_missing:
      name: "Water Tank Missing"

select:
  - platform: levoit_6000s
    levoit_6000s_id: humidifier
    mode:
      name: "Mode"

button:
  - platform: levoit_6000s
    levoit_6000s_id: humidifier
    reset_filter:
      name: "Reset Filter"
